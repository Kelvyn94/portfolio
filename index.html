<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (
          t === "dark" ||
          (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <title>Kelvin Macharia | Software & Web Developer, Kenya</title>
    <meta
      name="description"
      content="Portfolio of Kelvin Macharia, an IT graduate in Kenya building web software, business systems and practical digital tools."
    />
    <meta name="theme-color" content="#0b1220" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Kelvin Macharia | Software & Web Developer"
    />
    <meta
      property="og:description"
      content="Selected projects, skills and contact details."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
